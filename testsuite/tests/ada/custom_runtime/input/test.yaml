driver: python

input_lang: ada
project_file: test.gpr

control:
  - [SKIP, "env.build.platform != 'x86_64-linux'", "Custom runtime is for x86_64-linux only"]

input_lib_flags:
  - "--RTS=./rts-custom"

output_lib_flags:
  - "--RTS=../rts-custom"

scanner_extra_args:
  - "--RTS=./rts-custom"

# Using a custom Ada runtime implies that we need to recompile the GNATpolyglot
# runtime too.
sync_tree:
  - ../../../../../gnatpolyglot/runtimes
  - ../../../internal/sources

local_project_path:
  - "./ada"
  - "./gnatpolyglot"
