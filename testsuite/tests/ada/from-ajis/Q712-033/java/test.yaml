driver: proxy2print

input_proxy: ../input/
output_lang: java
test_file: Main.java

output_lib_flags: [ "-XLIBRARY_KIND=relocatable", "-XLIBRARY_STANDALONE=standard"]

control:
- [XFAIL, "True", "bug: subtypes of a class-wide type break the proxy (ST1_Classwide not declared); limitation: anonymous access types are not yet supported (FA1, FA2, P1, P2)"]
