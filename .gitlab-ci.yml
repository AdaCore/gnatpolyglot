stages:
  - single

check_issue:
  stage: single
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  services:
    - image:e3
    - cpu:1
  variables:
    GIT_STRATEGY: none # do not checkout the current repo, not needed
  script:
    - require_issue

.build_and_test: &build_and_test
  stage: single
  interruptible: true
  script:
    - generic_anod_ci
    - . /tmp/ci_env.sh
    - anod test gnatpolyglot $TEST_QUALIFIERS
    - testsuite_reports
  artifacts:
    reports:
      junit: xunit-*.xml

auto-linux:
  <<: *build_and_test
  variables:
    # The testsuite is fast enough that we can always run it with valgrind
    TEST_QUALIFIERS: "--qualifier=valgrind"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  services:
    - image:pe-base
    - cpu:8

manual-win:
  <<: *build_and_test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  services:
    - image:visual-studio-2022
    - platform:x86_64-windows-2022
    - cpu:8
